name: Release

# Builds the game for every supported platform and publishes a GitHub release
# when a tag starting with "v" is pushed, e.g. git tag v1.1-re3 && git push origin v1.1-re3
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GAME: re3
  GLFW_VERSION: "3.3.8"

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglfw3-dev libopenal-dev libmpg123-dev libsndfile1-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBRW_PLATFORM=GL3 -DLIBRW_GL3_GFXLIB=GLFW
          cmake --build build
      - name: Package
        run: |
          mkdir -p package
          cp -r gamefiles/. package/
          cp build/src/${GAME} package/
          tar -czf ${GAME}-linux-x64.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.GAME }}-linux-x64.tar.gz

  linux-x86:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Ubuntu no longer ships 32 bit development libraries (GLFW etc.), Debian still has a complete i386 port
      - name: Build in 32 bit Debian
        run: |
          docker run --rm -v "$PWD:/src" -w /src i386/debian:bookworm linux32 bash -c "
            set -e
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config libglfw3-dev libopenal-dev libmpg123-dev libsndfile1-dev
            cmake -S . -B build32 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBRW_PLATFORM=GL3 -DLIBRW_GL3_GFXLIB=GLFW
            cmake --build build32
            chown -R $(id -u):$(id -g) build32"
      - name: Package
        run: |
          file build32/src/${GAME}
          mkdir -p package
          cp -r gamefiles/. package/
          cp build32/src/${GAME} package/
          tar -czf ${GAME}-linux-x86.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86
          path: ${{ env.GAME }}-linux-x86.tar.gz

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        renderer: [d3d9, gl3]
        include:
          - arch: x64
            premake_arch: amd64
            dist: Win64
            glfw: WIN64
          - arch: x86
            premake_arch: x86
            dist: Win32
            glfw: WIN32
          - renderer: d3d9
            premake_renderer: librw_d3d9
          - renderer: gl3
            premake_renderer: librw_gl3_glfw
    env:
      PLATFORM: win-${{ matrix.premake_arch }}-${{ matrix.premake_renderer }}-oal
      PACKAGE: ${{ github.workspace }}/package
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - name: Download GLFW
        if: matrix.renderer == 'gl3'
        shell: pwsh
        run: |
          $name = "glfw-$env:GLFW_VERSION.bin.${{ matrix.glfw }}"
          Invoke-WebRequest "https://github.com/glfw/glfw/releases/download/$env:GLFW_VERSION/$name.zip" -OutFile glfw.zip
          Expand-Archive glfw.zip -DestinationPath .
          Rename-Item $name glfw
      - name: Build
        shell: pwsh
        run: |
          ./premake5 vs2019 --with-librw --no-full-paths --glfwdir64=glfw --glfwdir32=glfw
          # the bundled premake only knows vs2019, build with the toolset this runner has
          msbuild -m build/$env:GAME.sln /property:Configuration=Release /property:Platform=$env:PLATFORM /property:PlatformToolset=v143
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:PACKAGE | Out-Null
          Copy-Item -Recurse gamefiles/* $env:PACKAGE/
          Copy-Item bin/$env:PLATFORM/Release/$env:GAME.exe $env:PACKAGE/
          Copy-Item vendor/mpg123/dist/${{ matrix.dist }}/libmpg123-0.dll $env:PACKAGE/
          Copy-Item vendor/openal-soft/dist/${{ matrix.dist }}/OpenAL32.dll $env:PACKAGE/
          Compress-Archive -Path "$env:PACKAGE/*" -DestinationPath "$env:GAME-windows-${{ matrix.arch }}-${{ matrix.renderer }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.renderer }}
          path: ${{ env.GAME }}-windows-${{ matrix.arch }}-${{ matrix.renderer }}.zip

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: brew install ninja glfw openal-soft mpg123 dylibbundler
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DLIBRW_PLATFORM=GL3 -DLIBRW_GL3_GFXLIB=GLFW
          cmake --build build
      - name: Package
        run: |
          mkdir -p package
          cp -r gamefiles/. package/
          cp build/src/${GAME} package/
          # ship the Homebrew libraries (OpenAL Soft, GLFW, mpg123) next to the binary
          dylibbundler -od -b -x package/${GAME} -d package/libs -p @executable_path/libs/
          (cd package && zip -r -y ../${GAME}-macos-arm64.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.GAME }}-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-x64, linux-x86, windows, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
